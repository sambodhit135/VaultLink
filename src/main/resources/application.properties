# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3306/vaultlink_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===== SERVER =====
spring.application.name=vaultlink
server.port=8080

# ===== JWT =====
# Set this as environment variable in production
jwt.secret=${JWT_SECRET:dmF1bHRsaW5rLXN1cGVyLXNlY3JldC1qd3Qta2V5LTI1Ni1iaXRzLW1pbmltdW0tMjAyNA==}
jwt.expiration=86400000
app.jwt.secret=${JWT_SECRET:dmF1bHRsaW5rLXN1cGVyLXNlY3JldC1qd3Qta2V5LTI1Ni1iaXRzLW1pbmltdW0tMjAyNA==}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== MAIL =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== REDIS =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.vaultlink=DEBUG
