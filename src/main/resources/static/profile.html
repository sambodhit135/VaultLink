<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultLink - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar-vaultlink d-flex justify-content-between align-items-center px-4">
    <span class="navbar-brand">
      🔐 VaultLink
    </span>
    <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="navUserName">
          Hello, User
        </span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          ↩ Logout
        </button>
    </div>
</nav>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-item" onclick="location.href='dashboard.html'">
        📊 Dashboard
    </div>
    <div class="sidebar-item" onclick="location.href='documents.html'">
        📁 My Documents
    </div>
    <div class="sidebar-item" onclick="location.href='add-document.html'">
        📄 Add Document
    </div>
    <div class="sidebar-item" onclick="location.href='notifications.html'">
        🔔 Notifications
    </div>
    <div class="sidebar-item active" onclick="location.href='profile.html'">
        👤 Profile
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">👤 My Profile</h1>
            <p class="section-title">
              Manage your account settings
            </p>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <div class="row">

        <!-- Profile Info Card -->
        <div class="col-md-6 mb-4">
            <div class="vault-card">
                <h5 class="mb-4" style="color:var(--primary); font-weight:600;">
                  👤 Personal Information
                </h5>

                <div class="mb-3">
                    <label class="form-label fw-500">
                      First Name
                    </label>
                    <input type="text" class="form-control vault-input" id="firstName" placeholder="First Name">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-500">
                      Last Name
                    </label>
                    <input type="text" class="form-control vault-input" id="lastName" placeholder="Last Name">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-500">
                      Email Address
                    </label>
                    <input type="email" class="form-control" id="userEmail" disabled style="background:#f5f5f5; cursor:not-allowed;">
                    <small class="text-muted">
                      Email cannot be changed
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-500">
                      Member Since
                    </label>
                    <input type="text" class="form-control" id="memberSince" disabled style="background:#f5f5f5;">
                </div>

                <button class="btn btn-vaultlink w-100" onclick="updateProfile()">
                  💾 Save Changes
                </button>
            </div>
        </div>

        <!-- Change Password Card -->
        <div class="col-md-6 mb-4">
            <div class="vault-card">
                <h5 class="mb-4" style="color:var(--primary); font-weight:600;">
                  🔒 Change Password
                </h5>

                <div class="mb-3">
                    <label class="form-label fw-500">
                      Current Password
                    </label>
                    <input type="password" class="form-control vault-input" id="currentPassword" placeholder="Enter current password">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-500">
                      New Password
                    </label>
                    <input type="password" class="form-control vault-input" id="newPassword" placeholder="Min 6 characters">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-500">
                      Confirm New Password
                    </label>
                    <input type="password" class="form-control vault-input" id="confirmPassword" placeholder="Repeat new password">
                </div>

                <button class="btn btn-vaultlink w-100" onclick="savePassword()">
                  🔐 Update Password
                </button>
            </div>
        </div>

        <!-- Account Stats Card -->
        <div class="col-12">
            <div class="vault-card">
                <h5 class="mb-3" style="color:var(--primary); font-weight:600;">
                  📊 Account Statistics
                </h5>
                <div class="row text-center">
                    <div class="col-md-3">
                        <div class="summary-box summary-box-total p-3 rounded mb-2">
                            <div id="totalDocs" style="font-size:2rem; font-weight:700;">
                              -
                            </div>
                            <div>Total Documents</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="summary-box summary-box-critical p-3 rounded mb-2">
                            <div id="criticalDocs" style="font-size:2rem; font-weight:700;">
                              -
                            </div>
                            <div>Critical</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="summary-box summary-box-warning p-3 rounded mb-2">
                            <div id="warningDocs" style="font-size:2rem; font-weight:700;">
                              -
                            </div>
                            <div>Warning</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="summary-box summary-box-safe p-3 rounded mb-2">
                            <div id="safeDocs" style="font-size:2rem; font-weight:700;">
                              -
                            </div>
                            <div>Safe</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>

// Check login on page load
document.addEventListener('DOMContentLoaded', async function() {
    if (!isLoggedIn()) {
        window.location.href = 'login.html';
        return;
    }

    // Set navbar username
    const name = getUserName();
    document.getElementById('navUserName').textContent = 'Hello, ' + name;

    // Load user info from localStorage
    document.getElementById('firstName').value = localStorage.getItem('userFirstName') || '';
    document.getElementById('lastName').value = localStorage.getItem('userLastName') || '';
    document.getElementById('userEmail').value = localStorage.getItem('userEmail') || '';
    document.getElementById('memberSince').value = localStorage.getItem('memberSince') || 'N/A';

    // Load dashboard stats
    try {
        const dashboard = await getExpiryDashboard();
        document.getElementById('totalDocs').textContent = dashboard.totalDocuments || 0;
        document.getElementById('criticalDocs').textContent = dashboard.criticalCount || 0;
        document.getElementById('warningDocs').textContent = dashboard.warningCount || 0;
        document.getElementById('safeDocs').textContent = dashboard.safeCount || 0;
    } catch (e) {
        console.error('Failed to load stats:', e);
    }
});

// Update profile name
async function updateProfile() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();

    if (!firstName || !lastName) {
        showAlert('Please fill in all fields', 'warning');
        return;
    }

    // Save to localStorage for now
    localStorage.setItem('userFirstName', firstName);
    localStorage.setItem('userLastName', lastName);
    localStorage.setItem('userName', firstName);

    showAlert('Profile updated successfully!', 'success');
}

// Change password
async function savePassword() {
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!currentPassword || !newPassword || !confirmPassword) {
        showAlert('Please fill in all password fields', 'warning');
        return;
    }

    if (newPassword !== confirmPassword) {
        showAlert('New passwords do not match', 'danger');
        return;
    }

    if (newPassword.length < 6) {
        showAlert('Password must be at least 6 characters', 'warning');
        return;
    }

    try {
        const result = await changePassword(currentPassword, newPassword, confirmPassword);
        showAlert('Password changed successfully!', 'success');
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
    } catch (error) {
        showAlert(error.message || 'Failed to change password', 'danger');
    }
}

</script>
</body>
</html>
