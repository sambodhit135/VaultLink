<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultLink - Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .welcome-banner {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .welcome-banner::after {
            content: '\f518'; /* vault icon */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8rem;
            opacity: 0.1;
        }
        .date-display {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .clickable-card {
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .clickable-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        
        .empty-state {
            padding: 40px;
            text-align: center;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }
        .empty-state-safe {
            color: var(--safe);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-vaultlink fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard.html"><i class="fa-solid fa-vault"></i> VaultLink</a>
            
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white me-3 d-none d-md-block">Hello, <span id="navUserName">User</span></span>
                <button class="btn btn-sm btn-outline-light" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar d-none d-md-block">
        <a href="/dashboard.html" class="sidebar-item active">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
        <a href="/documents.html" class="sidebar-item">
            <i class="fa-solid fa-folder-open"></i> My Documents
        </a>
        <a href="/add-document.html" class="sidebar-item">
            <i class="fa-solid fa-file-circle-plus"></i> Add Document
        </a>
        <a href="/notifications.html" class="sidebar-item">
            <i class="fa-solid fa-bell"></i> Notifications
        </a>
        <a href="/profile.html" class="sidebar-item">
            <i class="fa-solid fa-user-gear"></i> Profile
        </a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div id="alertContainer"></div>

        <div class="page-header">
            <div>
                <h1 class="page-title">
                    📊 Dashboard
                </h1>
                <p class="section-title mb-0">
                    Overview of your document compliance and expiries
                </p>
            </div>
        </div>

        <!-- SECTION 1: Welcome Banner -->
        <div class="welcome-banner mt-3">
            <h2 class="mb-1">Welcome back, <span id="welcomeUserName">User</span>!</h2>
            <div class="date-display" id="todayDate"></div>
        </div>

        <!-- SECTION 2: Summary Cards -->
        <div class="row g-4 mb-5">
            <div class="col-md-3 col-sm-6">
                <div class="summary-box summary-box-total clickable-card" onclick="filterByStatus('ALL')">
                    <h3 id="countTotal">0</h3>
                    <p>Total Documents</p>
                    <i class="fa-solid fa-folder-open"></i>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="summary-box summary-box-critical clickable-card" onclick="filterByStatus('CRITICAL')">
                    <h3 id="countCritical">0</h3>
                    <p>Critical</p>
                    <i class="fa-solid fa-fire"></i>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="summary-box summary-box-warning clickable-card" onclick="filterByStatus('WARNING')">
                    <h3 id="countWarning">0</h3>
                    <p>Warning</p>
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="summary-box summary-box-safe clickable-card" onclick="filterByStatus('SAFE')">
                    <h3 id="countSafe">0</h3>
                    <p>Safe</p>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </div>

        <!-- SECTION 3: Critical Documents -->
        <div class="mb-5">
            <h4 class="section-title text-danger fw-bold"><i class="fa-solid fa-triangle-exclamation me-2"></i> Documents Requiring Immediate Attention</h4>
            
            <div id="criticalContainer">
                <!-- Table injected here -->
            </div>
        </div>

        <!-- SECTION 4: Warning Documents -->
        <div class="mb-4">
            <h4 class="section-title text-warning fw-bold"><i class="fa-solid fa-clock-rotate-left me-2"></i> Documents Expiring Soon</h4>
            
            <div id="warningContainer">
                <!-- Table injected here -->
            </div>
        </div>

    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS Utilities & API -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    
    <script>
        // 1. On Page Load
        document.addEventListener('DOMContentLoaded', () => {
            // Auth check
            if (!isLoggedIn()) {
                window.location.href = '/login.html';
                return;
            }

            // Set Username & Date
            const userName = getUserName();
            document.getElementById('navUserName').textContent = userName;
            document.getElementById('welcomeUserName').textContent = userName;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', options);

            // Fetch data
            loadDashboardData();

            // Auto-refresh every 5 minutes (300,000 ms)
            setInterval(loadDashboardData, 300000);
        });

        // Fetch API and render
        async function loadDashboardData() {
            showLoading(true);
            try {
                const summary = await getExpiryDashboard();
                
                // Update counts
                document.getElementById('countTotal').textContent = summary.totalDocuments || 0;
                document.getElementById('countCritical').textContent = summary.criticalCount || 0;
                document.getElementById('countWarning').textContent = summary.warningCount || 0;
                document.getElementById('countSafe').textContent = summary.safeCount || 0;

                // Render Tables
                renderTable('criticalContainer', summary.criticalDocuments, 'CRITICAL');
                renderTable('warningContainer', summary.warningDocuments, 'WARNING');

            } catch (error) {
                showAlert('Failed to load dashboard data.', 'danger');
                console.error(error);
            } finally {
                showLoading(false);
            }
        }

        // Render Table HTML
        function renderTable(containerId, documents, type) {
            const container = document.getElementById(containerId);
            
            if (!documents || documents.length === 0) {
                if (type === 'CRITICAL') {
                    container.innerHTML = `
                        <div class="empty-state empty-state-safe">
                            <i class="fa-solid fa-check-circle fa-3x mb-3"></i>
                            <h5>All documents are safe!</h5>
                            <p class="text-muted mb-0">You have no critical documents pending action.</p>
                        </div>`;
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-folder-open fa-3x text-muted mb-3"></i>
                            <h5 class="text-muted">No documents expiring soon.</h5>
                        </div>`;
                }
                return;
            }

            let tableHtml = `
                <div class="table-responsive">
                    <table class="vault-table">
                        <thead>
                            <tr>
                                <th>Document Name</th>
                                <th>Category</th>
                                <th>Expiry Date</th>
                                <th>Time Left</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            documents.forEach(doc => {
                tableHtml += renderDocumentRow(doc);
            });

            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = tableHtml;
        }

        // 2. Render Single Row
        function renderDocumentRow(doc) {
            const expiryDate = formatDate(doc.expiryDate);
            const timeText = daysUntilText(doc.daysUntilExpiry);
            const badge = getStatusBadge(doc.documentStatus);
            const categoryName = doc.category ? doc.category.name : "Uncategorized";

            return `
                <tr>
                    <td class="fw-bold">${doc.title}</td>
                    <td><span class="badge bg-light text-dark border">${categoryName}</span></td>
                    <td>${expiryDate}</td>
                    <td><span class="fw-medium">${timeText}</span></td>
                    <td>${badge}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-vaultlink" onclick="viewDocument(${doc.id})">
                            <i class="fa-solid fa-eye"></i> View
                        </button>
                    </td>
                </tr>
            `;
        }

        // 3. Navigation Helpers
        function viewDocument(id) {
            window.location.href = "documents.html?highlight=" + id;
        }

        function filterByStatus(status) {
            if (status === 'ALL') {
                window.location.href = "documents.html";
            } else {
                window.location.href = "documents.html?status=" + status;
            }
        }
    </script>
</body>
</html>
