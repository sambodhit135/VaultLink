<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultLink - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-bg {
            background: linear-gradient(135deg, var(--bg), #E3F2FD);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .auth-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border: none;
        }
        .vault-brand {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }
        .vault-tagline {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        /* Password Strength Bar */
        .password-strength-container {
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 3px;
        }
        .strength-weak { background-color: var(--critical); width: 33%; }
        .strength-medium { background-color: var(--warning); width: 66%; }
        .strength-strong { background-color: var(--safe); width: 100%; }
        .strength-text {
            font-size: 0.8rem;
            margin-top: 4px;
            display: block;
            text-align: right;
            color: var(--text-secondary);
        }
    </style>
</head>
<body class="auth-bg">

    <div id="alertContainer"></div>

    <div class="auth-card">
        <div class="vault-brand">
            <i class="fa-solid fa-vault"></i> VaultLink
        </div>
        <div class="vault-tagline">Create your secure vault</div>

        <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
            
            <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control vault-input" id="firstName" placeholder="John" required>
                </div>
                <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control vault-input" id="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="regEmail" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control vault-input border-start-0 ps-0" id="regEmail" placeholder="name@example.com" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control vault-input border-start-0 ps-0" id="regPassword" placeholder="Create a password" required oninput="checkPasswordStrength()">
                </div>
                <div class="password-strength-container">
                    <div id="strengthBar" class="password-strength-bar"></div>
                </div>
                <span id="strengthText" class="strength-text"></span>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control vault-input border-start-0 ps-0" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-vaultlink w-100 py-2 mb-3" id="regBtn">
                <span id="regBtnText">Create Account</span>
                <span id="regBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>

            <div class="text-center mt-3">
                <span class="text-muted-custom">Already have an account?</span> 
                <a href="/login.html" class="text-decoration-none" style="color: var(--primary); font-weight: 600;">Login here</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS Utilities & API -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    
    <script>
        // Redirect to dashboard if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (isLoggedIn()) {
                window.location.href = '/dashboard.html';
            }
        });

        // Password Strength Checker
        function checkPasswordStrength() {
            const pwd = document.getElementById('regPassword').value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            // Reset classes
            bar.className = 'password-strength-bar';
            
            if (pwd.length === 0) {
                bar.style.width = '0%';
                text.textContent = '';
            } else if (pwd.length < 6) {
                bar.classList.add('strength-weak');
                text.textContent = 'Weak';
                text.style.color = 'var(--critical)';
            } else if (pwd.length >= 6 && pwd.length < 10) {
                bar.classList.add('strength-medium');
                text.textContent = 'Medium';
                text.style.color = 'var(--warning)';
            } else {
                bar.classList.add('strength-strong');
                text.textContent = 'Strong';
                text.style.color = 'var(--safe)';
            }
        }

        // Handle Registration Submission
        async function handleRegister() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const btn = document.getElementById('regBtn');
            const btnText = document.getElementById('regBtnText');
            const spinner = document.getElementById('regBtnSpinner');

            // 1. Validation
            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                showAlert('All fields are required.', 'warning');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Please enter a valid email address.', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match.', 'danger');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long.', 'warning');
                return;
            }

            // 2. UI Loading state
            btn.disabled = true;
            btnText.textContent = 'Creating Account... ';
            spinner.classList.remove('d-none');

            // 3. API Call
            try {
                const response = await register(firstName, lastName, email, password);
                
                // Show success
                showAlert('Account created successfully! Redirecting to login...', 'success');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
                
            } catch (error) {
                console.error("Registration failed:", error);
                
                // Extract error message
                let errorMsg = 'Registration failed. Please try again.';
                if (error.message) errorMsg = error.message;
                
                showAlert(errorMsg, 'danger');
                
                // Reset UI state
                btn.disabled = false;
                btnText.textContent = 'Create Account';
                spinner.classList.add('d-none');
            }
        }
    </script>
</body>
</html>
